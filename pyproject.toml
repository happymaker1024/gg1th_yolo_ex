[project]
name = "yolo-ex"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
